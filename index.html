<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STARFORGE — Forge the Cosmos</title>
  <meta name="description" content="STARFORGE: a deep idle game. Forge stars from stardust, ascend, explore endless rifts, transcend.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff6c8'/%3E%3Cstop offset='.45' stop-color='%23ffb347'/%3E%3Cstop offset='1' stop-color='%23ff6a2a' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Cpath d='M32 6l5 21 21 5-21 5-5 21-5-21-21-5 21-5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fx.css">
  <link rel="stylesheet" href="css/forge.css">
  <link rel="stylesheet" href="css/constellation.css">
  <link rel="stylesheet" href="css/rifts.css">
  <link rel="stylesheet" href="css/transcend.css">
  <link rel="stylesheet" href="css/meta.css">
</head>
<body>
  <div id="bg-stars" aria-hidden="true"><div class="nebula n1"></div><div class="nebula n2"></div><div class="nebula n3"></div></div>

  <header id="header">
    <div class="brand" title="STARFORGE">
      <span class="brand-star">✦</span>
      <span class="brand-name">STAR<span>FORGE</span></span>
    </div>
    <div id="resource-bar"></div>
    <div id="header-actions">
      <span id="speed-indicator" class="tag tag-warn" style="display:none"></span>
      <span id="save-info" class="muted small"></span>
      <button id="btn-save" class="btn btn-icon btn-ghost" aria-label="Save">💾</button>
      <button id="btn-savemenu" class="btn btn-icon btn-ghost" aria-label="Save management" data-tip="Export / import / reset save">⇅</button>
    </div>
  </header>

  <div id="app">
    <nav id="tab-nav" aria-label="Sections"></nav>
    <main id="content"></main>
  </div>

  <div id="toast-stack" aria-live="polite"></div>
  <div id="tooltip" role="tooltip"></div>
  <div id="modal-root"></div>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <noscript><div class="panel" style="margin:40px">STARFORGE needs JavaScript enabled.</div></noscript>

  <!-- Load order is part of the module contract (see SPEC.md) -->
  <script src="js/util.js"></script>
  <script src="js/state.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/forge.js"></script>
  <script src="js/comets.js"></script>
  <script src="js/ascension.js"></script>
  <script src="js/constellation.js"></script>
  <script src="js/items.js"></script>
  <script src="js/rifts.js"></script>
  <script src="js/transcend.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
